<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bwekh Player — Ruffle</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
	-webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
	font-family: Roboto, "Noto Sans", sans-serif; touch-action: none; }
#game { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
#game ruffle-player, #game ruffle-object, #game > * { width: 100%; height: 100%; display: block; }

.pad { position: fixed; touch-action: none; z-index: 10; }
.pad .ring { position: absolute; border-radius: 50%; box-sizing: border-box;
	background: rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.6); }
.pad .dir { position: absolute; border-radius: 50%; background: rgba(255,255,255,.2);
	display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.95); }
.pad .btn { position: absolute; border-radius: 50%; box-sizing: border-box; background: rgba(0,0,0,.35);
	border: 2px solid rgba(255,255,255,.6); color: #fff; font-weight: bold;
	display: flex; align-items: center; justify-content: center; }
.pad .on { background: rgba(255,64,129,.95) !important; }

#pauseBtn { position: fixed; top: 12px; right: 12px; width: 48px; height: 48px; border-radius: 50%;
	background: rgba(0,0,0,.4); z-index: 20; display: flex; align-items: center; justify-content: center;
	transition: opacity .4s; }
#pauseBtn.idle { opacity: .1; }
#pauseBtn i { display: block; width: 6px; height: 20px; background: #fff; margin: 0 3px; border-radius: 1px; }

#menu { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); z-index: 30; display: none;
	align-items: center; justify-content: center; }
#menu.open { display: flex; }
#menu .card { background: #fff; border-radius: 8px; padding: 20px 20px 12px; min-width: 260px; max-width: 86vw;
	box-shadow: 0 8px 24px rgba(0,0,0,.4); }
#menu h1 { font-size: 20px; margin: 0 0 4px; color: #212121; }
#menu .sub { font-size: 13px; color: #757575; margin-bottom: 14px; word-break: break-all; }
#menu .row { display: flex; flex-wrap: wrap; justify-content: flex-end; }
#menu button { font: inherit; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: .5px;
	border: 0; background: none; color: #FF4081; padding: 10px 12px; border-radius: 4px; }
#menu button.main { background: #FF4081; color: #fff; }
#menu button:active { background: #FCE4EC; }
#menu button.main:active { background: #F50057; }

#fail { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 50; display: none;
	align-items: center; justify-content: center; }
#fail.open { display: flex; }
#fail .card { background: #fff; border-radius: 8px; padding: 20px 20px 12px; max-width: 86vw;
	box-shadow: 0 8px 24px rgba(0,0,0,.4); }
#fail h1 { font-size: 20px; margin: 0 0 8px; color: #212121; }
#fail p { font-size: 14px; color: #424242; margin: 0 0 8px; }
#fail .info { font-size: 12px; color: #9E9E9E; margin-bottom: 12px; }
#fail .row { display: flex; flex-wrap: wrap; justify-content: flex-end; }
#menu .row button, #fail .row button { margin: 2px; }
#fail button { font: inherit; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: .5px;
	border: 0; background: none; color: #FF4081; padding: 10px 12px; border-radius: 4px; }
#fail button.main { background: #FF4081; color: #fff; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #323232; color: #fff;
	padding: 12px 18px; border-radius: 4px; font-size: 14px; z-index: 40; display: none; max-width: 80vw; }
</style>
</head>
<body>
<div id="game"></div>
<div id="pauseBtn"><i></i><i></i></div>
<div id="menu"><div class="card">
	<h1>Paused</h1>
	<div class="sub" id="menuName"></div>
	<div class="row">
		<button id="mRenderer"></button>
		<button id="mPad"></button>
		<button id="mRestart">Restart</button>
		<button id="mExit">Exit</button>
		<button id="mCont" class="main">Continue</button>
	</div>
</div></div>
<div id="fail"><div class="card">
	<h1>Ruffle can't play this</h1>
	<p id="failText"></p>
	<div class="info" id="failInfo"></div>
	<div class="row">
		<button id="failRenderer">Try another renderer</button>
		<button id="failExit">Exit</button>
		<button id="failFallback" class="main"></button>
	</div>
</div></div>
<div id="toast"></div>
<script src="bw.js"></script>
</body>
</html>
